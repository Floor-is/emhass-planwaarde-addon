# Copy of the official EMHASS add-on (davidusb-geek/emhass-add-on, emhass/config.yml @ v0.18.3, version
# followed up to v0.18.4), with deliberate deviations so it can run ALONGSIDE the official add-on:
#   1. its own slug, name and image (ghcr.io/floor-is/emhass, built from the fork Floor-is/emhass);
#   2. host port 5001 instead of 5000 (the official add-on keeps 5000);
#   3. no map to /share. The official add-on keeps config.json, params.pkl and opt_res_latest.csv in
#      /share/emhass; this add-on cannot reach them. With config_path "default", EMHASS moves a
#      /share/config.json into its own /config; without /share that cannot happen either;
#   4. no `webui` and no `hassio_role: default` (add-on linter: redundant with ingress / default value).
name: EMHASS planwaarde
description: EMHASS fork with a terminal value for the battery and a value per kWh for a deferrable load
url: https://github.com/Floor-is/emhass
version: v0.18.4-planwaarde.5
slug: emhass_planwaarde
arch:
  - aarch64
  - amd64
image: "ghcr.io/floor-is/emhass"
ports:
  5000/tcp: 5001
ports_description:
  5000/tcp: Web interface and API
map:
  - type: addon_config
    path: /config
    read_only: False
init: false
homeassistant_api: true
ingress: true
ingress_port: 5000
ingress_stream: true
panel_icon: mdi:home-lightning-bolt-outline
panel_title: EMHASS planwaarde
options:
  data_path: /config
  config_path: /config/config.json
schema:
  hass_url: "str?" #optional
  long_lived_token: "password?" #optional
  data_path: "list(/config|/data)"
  config_path: "list(/config/config.json)"
  time_zone: "match((\\w+)?(\\/)(\\w+))?" #optional
  Latitude: "float?" #optional
  Longitude: "float?" #optional
  Altitude: "float?" #optional
  solcast_api_key: "password?" #optional
  solcast_rooftop_id: "str?" #optional
  solar_forecast_kwp: "float?" #optional
  server_ip: "list(0.0.0.0|127.0.0.1)?" #optional
  influxdb_username: "str?" #optional
  influxdb_password: "password?" #optional
  victoriametrics_username: "str?" #optional
  victoriametrics_password: "password?" #optional
