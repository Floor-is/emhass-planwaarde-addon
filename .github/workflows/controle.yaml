# Fails hard if config.yml is invalid or if the image:version it points to does not exist
# for both architectures. The add-on builds nothing itself; the image comes from
# Floor-is/emhass (workflow "PLANWAARDE image"), just as the official add-on takes its image
# from davidusb-geek/emhass.
name: check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./emhass_planwaarde"
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: image:version exists for aarch64 and amd64
        run: |
          img=$(yq -r .image emhass_planwaarde/config.yml)
          ver=$(yq -r .version emhass_planwaarde/config.yml)
          echo "checking $img:$ver"
          docker buildx imagetools inspect "$img:$ver" --format '{{json .Manifest}}' > manifest.json
          jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | index("linux/arm64") and index("linux/amd64")' manifest.json
